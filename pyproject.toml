[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tesla-forecast"
version = "2.0.0"
description = "Walk-forward validated, ensemble-based forecasting of Tesla (TSLA) stock prices with calibrated prediction intervals."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "torch>=2.2",
    "arch>=7.0",
    "yfinance>=0.2.54",
    "requests>=2.31",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "joblib>=1.3",
    "plotly>=5.20",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.optional-dependencies]
app = ["streamlit>=1.50"]
llm = ["langchain>=0.3", "langchain-huggingface>=0.1", "langchain-openai>=0.2"]
explain = ["shap>=0.45"]
dev = ["pytest>=8", "ruff>=0.5", "nbformat>=5", "nbconvert>=7", "ipykernel"]

[project.scripts]
tesla-forecast = "tesla_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tesla_forecast = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::UserWarning",
]
markers = ["slow: slower end-to-end tests"]

[tool.ruff.lint.per-file-ignores]
"src/tesla_forecast/viz/report.py" = ["E702"]  # compact matplotlib styling lines
